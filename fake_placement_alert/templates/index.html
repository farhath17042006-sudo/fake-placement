<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Fake Placement Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Fake Placement Alert Checker</h1>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form method="post">
            <textarea name="message" rows="7" placeholder="Paste message here..."></textarea><br>
            <button type="submit">Check</button>
        </form>
    </div>
</body>
</html>
